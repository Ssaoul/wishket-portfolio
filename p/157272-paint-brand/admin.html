<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · PRISM 페인트 (제안용 데모)</title>
<meta name="description" content="관리자 콘텐츠 관리 — 제품·시공사례 등록·수정·삭제 데모.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6f5e'/><rect x='9' y='8' width='5' height='16' rx='2' fill='%23c06a4a'/><rect x='16' y='8' width='5' height='16' rx='2' fill='%23ecd9b6'/></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
  <section style="padding:36px 0 60px">
    <div class="wrap">
      <div class="sec-head" style="margin-bottom:20px"><span class="tag">Admin</span><h2>콘텐츠 관리</h2><p>제품과 시공 사례를 내부에서 직접 등록·수정·삭제·공개 전환할 수 있습니다(발주 2-2).</p></div>
      <div class="admin-shell">
        <aside class="admin-side">
          <div class="b">PRISM 관리자</div>
          <a class="on" data-tab="prod" href="#">제품 관리</a>
          <a data-tab="case" href="#">시공 사례 관리</a>
          <a href="index.html" style="margin-top:14px;opacity:.7">← 사이트로</a>
        </aside>
        <div class="admin-main">
          <div class="admin-top">
            <h3 id="paneTitle">제품 관리</h3>
            <span class="pill off" id="cnt">0건</span>
            <span class="sp"></span>
            <button class="ibtn primary" id="addBtn">＋ 새로 등록</button>
          </div>
          <div style="overflow-x:auto">
            <table class="tbl">
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="note" style="margin-top:16px">데모 — 등록·수정·삭제는 화면에서 즉시 반영되지만 서버에 저장되지 않습니다(새로고침 시 초기화). 실제 구축 시 아임웹 관리자 또는 자체 관리 화면으로 저장·이미지 업로드까지 연결하고, 사용법 매뉴얼을 함께 드립니다.</div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 등록/수정 모달 -->
<div class="modal" id="modal">
  <div class="box">
    <h4 id="mTitle">새로 등록</h4>
    <div class="field"><label>이름 *</label><input id="m-name" placeholder="제품/사례 이름"></div>
    <div class="field"><label id="m-cat-label">분류</label>
      <select id="m-cat"></select></div>
    <div class="field"><label>설명</label><textarea id="m-desc" placeholder="간단한 설명"></textarea></div>
    <div class="field"><label>공개 여부</label>
      <select id="m-pub"><option value="1">공개</option><option value="0">비공개</option></select></div>
    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:6px">
      <button class="ibtn" id="mCancel">취소</button>
      <button class="ibtn primary" id="mSave">저장</button>
    </div>
  </div>
</div>

<script src="assets/js/site.js"></script>
<script>
  PR.renderChrome('admin'); PR.renderFooter();
  // 편집 가능한 로컬 복제본 (원본 데이터 오염 방지 + 공개 플래그 추가)
  var DB = {
    prod: PR.PRODUCTS.map(function(p){ return { id:p.id, name:p.name, cat:p.cat, desc:p.desc, img:p.img, pub:1 }; }),
    case: PR.CASES.map(function(c){ return { id:c.id, name:c.title, cat:c.type, desc:c.desc, img:c.img, pub:1 }; })
  };
  var CATS = { prod:['실내용','외부용','기능성','컬러 컬렉션'], case:['주거','상업','외부','컨설팅'] };
  var tab='prod', editing=null, seq=100;

  function render(){
    var rows = DB[tab];
    document.getElementById('paneTitle').textContent = tab==='prod'?'제품 관리':'시공 사례 관리';
    document.getElementById('cnt').textContent = rows.length+'건';
    document.getElementById('thead').innerHTML = '<tr><th>이미지</th><th>'+(tab==='prod'?'제품명':'사례명')+'</th><th>분류</th><th>공개</th><th style="text-align:right">관리</th></tr>';
    document.getElementById('tbody').innerHTML = rows.map(function(r){
      return '<tr><td><img class="thumb-sm" src="'+r.img+'" alt=""></td>'
        + '<td><b>'+r.name+'</b><br><span class="small" style="color:var(--ink-3)">'+(r.desc||'').slice(0,32)+'</span></td>'
        + '<td>'+r.cat+'</td>'
        + '<td><span class="pill '+(r.pub?'on':'off')+'" data-toggle="'+r.id+'" style="cursor:pointer">'+(r.pub?'공개':'비공개')+'</span></td>'
        + '<td style="text-align:right;white-space:nowrap"><button class="ibtn" data-edit="'+r.id+'">수정</button> <button class="ibtn danger" data-del="'+r.id+'">삭제</button></td></tr>';
    }).join('');
  }
  render();

  document.querySelectorAll('.admin-side a[data-tab]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault();
      document.querySelectorAll('.admin-side a[data-tab]').forEach(function(x){x.classList.remove('on');});
      a.classList.add('on'); tab=a.dataset.tab; render();
    });
  });

  // 테이블 액션
  document.getElementById('tbody').addEventListener('click', function(e){
    var ed=e.target.closest('[data-edit]'), dl=e.target.closest('[data-del]'), tg=e.target.closest('[data-toggle]');
    if(ed){ openModal(DB[tab].find(function(r){return r.id===ed.dataset.edit;})); }
    if(dl){ var id=dl.dataset.del; DB[tab]=DB[tab].filter(function(r){return r.id!==id;}); render(); PR.toast('삭제되었습니다'); }
    if(tg){ var r=DB[tab].find(function(x){return x.id===tg.dataset.toggle;}); r.pub=r.pub?0:1; render(); PR.toast(r.pub?'공개로 전환':'비공개로 전환'); }
  });

  // 모달
  function fillCats(){ document.getElementById('m-cat').innerHTML = CATS[tab].map(function(c){return '<option>'+c+'</option>';}).join(''); document.getElementById('m-cat-label').textContent = tab==='prod'?'제품 분류':'사례 유형'; }
  function openModal(row){
    editing = row || null; fillCats();
    document.getElementById('mTitle').textContent = row?'수정':'새로 등록';
    document.getElementById('m-name').value = row?row.name:'';
    document.getElementById('m-cat').value = row?row.cat:CATS[tab][0];
    document.getElementById('m-desc').value = row?row.desc:'';
    document.getElementById('m-pub').value = row?String(row.pub):'1';
    document.getElementById('modal').classList.add('on');
  }
  document.getElementById('addBtn').onclick=function(){ openModal(null); };
  document.getElementById('mCancel').onclick=function(){ document.getElementById('modal').classList.remove('on'); };
  document.getElementById('mSave').onclick=function(){
    var name=document.getElementById('m-name').value.trim();
    if(!name){ PR.toast('이름을 입력하세요'); return; }
    var data={ name:name, cat:document.getElementById('m-cat').value, desc:document.getElementById('m-desc').value.trim(), pub:+document.getElementById('m-pub').value };
    if(editing){ Object.assign(editing, data); PR.toast('수정되었습니다'); }
    else { var imgs=Object.values(PR.IMG); DB[tab].unshift(Object.assign({ id:tab.toUpperCase()+(++seq), img:imgs[Math.floor(seq%imgs.length)] }, data)); PR.toast('등록되었습니다'); }
    document.getElementById('modal').classList.remove('on'); render();
  };
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal') document.getElementById('modal').classList.remove('on'); });
</script>
</body>
</html>
