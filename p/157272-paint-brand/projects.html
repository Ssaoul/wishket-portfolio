<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시공 사례 · PRISM 페인트 (제안용 데모)</title>
<meta name="description" content="PRISM 페인트 시공 사례 갤러리. 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6f5e'/><rect x='9' y='8' width='5' height='16' rx='2' fill='%23c06a4a'/><rect x='16' y='8' width='5' height='16' rx='2' fill='%23ecd9b6'/></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
  <section style="padding-bottom:0">
    <div class="wrap">
      <div class="sec-head"><span class="tag">Projects</span><h2>시공 사례</h2><p>주거·상업·외부 도장과 컬러 컨설팅. 카드를 클릭하면 크게 볼 수 있습니다.</p></div>
      <div class="filters" id="filters">
        <button class="on" data-f="전체">전체</button>
        <button data-f="주거">주거</button>
        <button data-f="상업">상업</button>
        <button data-f="외부">외부</button>
        <button data-f="컨설팅">컨설팅</button>
      </div>
    </div>
  </section>
  <section style="padding-top:26px">
    <div class="wrap"><div class="gallery" id="grid"></div></div>
  </section>
  <div class="wrap" style="padding-bottom:44px"><div class="note"><b>정직 고지</b> — 시공 사진·프로젝트명은 전부 합성입니다. 실제 구축 시 발주처가 제공하는 시공 사진으로 채웁니다. 고해상도 사진이 많이 올라가는 특성을 고려해, 갤러리는 <b>비율 고정 격자 + 지연 로딩</b>으로 설계했고 관리자에서 사진을 직접 등록·정렬할 수 있습니다.</div></div>
</main>

<!-- 라이트박스 -->
<div class="lb" id="lb">
  <button class="x" id="lbx">×</button>
  <button class="nav-btn prev" id="lbp">‹</button>
  <div><img id="lbimg" src="" alt="시공 사례"><div class="cap" id="lbcap"></div></div>
  <button class="nav-btn next" id="lbn">›</button>
</div>

<script src="assets/js/site.js"></script>
<script>
  PR.renderChrome('projects'); PR.renderFooter();
  var cur='전체', view=[];
  function draw(){
    view = PR.CASES.filter(function(c){ return cur==='전체' || c.type===cur; });
    document.getElementById('grid').innerHTML = view.map(function(c,i){
      return '<div class="case" data-i="'+i+'" style="background-image:url(\''+c.img+'\')"><span class="badge">'+c.type+'</span>'
        + '<div class="cap"><div class="t">'+c.title+'</div><div class="s">'+c.product+'</div></div></div>';
    }).join('');
  }
  draw();
  document.getElementById('filters').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#filters button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); cur=b.dataset.f; draw();
  });
  var idx=0;
  function open(i){ idx=i; var c=view[i]; document.getElementById('lbimg').src=c.img;
    document.getElementById('lbcap').innerHTML='<b>'+c.title+'</b> · '+c.type+' · '+c.product+'<br><span style="opacity:.8">'+c.desc+'</span>';
    document.getElementById('lb').classList.add('on'); }
  document.getElementById('grid').addEventListener('click', function(e){ var el=e.target.closest('.case'); if(el) open(+el.dataset.i); });
  document.getElementById('lbx').onclick=function(){ document.getElementById('lb').classList.remove('on'); };
  document.getElementById('lb').addEventListener('click', function(e){ if(e.target.id==='lb') document.getElementById('lb').classList.remove('on'); });
  document.getElementById('lbp').onclick=function(){ open((idx-1+view.length)%view.length); };
  document.getElementById('lbn').onclick=function(){ open((idx+1)%view.length); };
  document.addEventListener('keydown', function(e){ if(!document.getElementById('lb').classList.contains('on'))return; if(e.key==='Escape')document.getElementById('lb').classList.remove('on'); if(e.key==='ArrowLeft')document.getElementById('lbp').click(); if(e.key==='ArrowRight')document.getElementById('lbn').click(); });
</script>
</body>
</html>
