<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 시트웍스 (제안용 데모)</title>
<meta name="description" content="시트웍스 관리자 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
  <section style="padding:36px 0 60px"><div class="wrap">
    <div class="sec-head" style="margin-bottom:20px"><span class="tag">Admin</span><h2>콘텐츠 관리</h2>
      <p>제품과 사례를 내부에서 직접 등록·수정·삭제하고 공개 여부를 전환할 수 있습니다.</p></div>
    <div class="admin-shell">
      <aside class="admin-side">
        <div class="b">시트웍스 관리자</div>
        <a class="on" data-tab="item" href="#">제품·서비스 관리</a>
        <a data-tab="case" href="#">시공·구축 사례 관리</a>
        <a href="index.html" style="margin-top:14px;opacity:.7">← 사이트로</a>
      </aside>
      <div class="admin-main">
        <div class="admin-top"><h3 id="paneTitle">관리</h3><span class="pill off" id="cnt">0건</span><span class="sp"></span>
          <button class="ibtn primary" id="addBtn">＋ 새로 등록</button></div>
        <div style="overflow-x:auto"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <div class="note" style="margin-top:16px">데모 — 등록·수정·삭제가 화면에서 즉시 반영되지만 서버에 저장되지 않습니다(새로고침 시 초기화). 실제 구축 시 저장·이미지 업로드까지 연결하고 사용 매뉴얼을 함께 드립니다.</div>
      </div>
    </div>
  </div></section>
  <div class="modal" id="modal"><div class="box">
    <h4 id="mTitle">새로 등록</h4>
    <div class="field"><label>이름 *</label><input id="m-name" placeholder="이름"></div>
    <div class="field"><label>분류</label><select id="m-cat"></select></div>
    <div class="field"><label>설명</label><textarea id="m-desc" placeholder="간단한 설명"></textarea></div>
    <div class="field"><label>공개 여부</label><select id="m-pub"><option value="1">공개</option><option value="0">비공개</option></select></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
      <button class="ibtn" id="mCancel">취소</button><button class="ibtn primary" id="mSave">저장</button></div>
  </div></div>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("admin"); DEMO.footer();</script>
<script>
(function(){
  var D=DEMO.D;
  var DB={ item:D.items.map(function(x){return Object.assign({},x);}), case:D.cases.map(function(x){return {id:x.id,name:x.title,cat:x.type,desc:x.desc,img:x.img,pub:1};}) };
  var CATS={ item:D.cats.slice(), case:D.caseCats.slice() };
  var tab='item', editing=null, seq=100;
  var tbody=document.getElementById('tbody'), thead=document.getElementById('thead'), modal=document.getElementById('modal');
  function render(){
    var rows=DB[tab];
    document.getElementById('paneTitle').textContent = tab==='item'? D.labels.catalog+' 관리' : D.labels.gallery+' 관리';
    document.getElementById('cnt').textContent = rows.length+'건';
    thead.innerHTML='<tr><th>이미지</th><th>이름</th><th>분류</th><th>공개</th><th style="text-align:right">관리</th></tr>';
    tbody.innerHTML=rows.map(function(r){
      return '<tr><td><img class="thumb-sm" src="'+r.img+'" alt=""></td>'
      +'<td><b>'+DEMO.esc(r.name)+'</b><br><span style="font-size:12px;color:var(--ink-3)">'+DEMO.esc(String(r.desc||'').slice(0,30))+'</span></td>'
      +'<td>'+DEMO.esc(r.cat)+'</td>'
      +'<td><span class="pill '+(r.pub?'on':'off')+'" data-toggle="'+r.id+'" style="cursor:pointer">'+(r.pub?'공개':'비공개')+'</span></td>'
      +'<td style="text-align:right;white-space:nowrap"><button class="ibtn" data-edit="'+r.id+'">수정</button> <button class="ibtn danger" data-del="'+r.id+'">삭제</button></td></tr>';
    }).join('');
  }
  document.querySelectorAll('.admin-side a[data-tab]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault();
      document.querySelectorAll('.admin-side a[data-tab]').forEach(function(x){x.classList.remove('on');});
      a.classList.add('on'); tab=a.dataset.tab; render();
    });
  });
  tbody.addEventListener('click', function(e){
    var ed=e.target.closest('[data-edit]'), dl=e.target.closest('[data-del]'), tg=e.target.closest('[data-toggle]');
    if(ed){ openModal(DB[tab].filter(function(r){return r.id===ed.dataset.edit;})[0]); }
    if(dl){ DB[tab]=DB[tab].filter(function(r){return r.id!==dl.dataset.del;}); render(); DEMO.toast('삭제되었습니다'); }
    if(tg){ var r=DB[tab].filter(function(x){return x.id===tg.dataset.toggle;})[0]; r.pub=r.pub?0:1; render(); DEMO.toast(r.pub?'공개로 전환':'비공개로 전환'); }
  });
  function fillCats(){
    document.getElementById('m-cat').innerHTML=CATS[tab].map(function(c){return '<option>'+DEMO.esc(c)+'</option>';}).join('');
  }
  function openModal(row){
    editing=row||null; fillCats();
    document.getElementById('mTitle').textContent=row?'수정':'새로 등록';
    document.getElementById('m-name').value=row?row.name:'';
    document.getElementById('m-cat').value=row?row.cat:CATS[tab][0];
    document.getElementById('m-desc').value=row?row.desc:'';
    document.getElementById('m-pub').value=row?String(row.pub):'1';
    modal.classList.add('on');
  }
  document.getElementById('addBtn').onclick=function(){ openModal(null); };
  document.getElementById('mCancel').onclick=function(){ modal.classList.remove('on'); };
  document.getElementById('mSave').onclick=function(){
    var name=document.getElementById('m-name').value.trim();
    if(!name){ DEMO.toast('이름을 입력하세요'); return; }
    var d={ name:name, cat:document.getElementById('m-cat').value, desc:document.getElementById('m-desc').value.trim(), pub:+document.getElementById('m-pub').value };
    if(editing){ Object.assign(editing,d); DEMO.toast('수정되었습니다'); }
    else {
      var pool=DB[tab].length?DB[tab]:[{img:'assets/img/item-0.svg'}];
      DB[tab].unshift(Object.assign({ id:tab.toUpperCase()+(++seq), img:pool[0].img }, d));
      DEMO.toast('등록되었습니다');
    }
    modal.classList.remove('on'); render();
  };
  modal.addEventListener('click', function(e){ if(e.target.id==='modal') modal.classList.remove('on'); });
  render();
})();
</script>
</body>
</html>
