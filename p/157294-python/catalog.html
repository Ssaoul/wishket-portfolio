<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주요 화면 · 세담엔진 (제안용 데모)</title>
<meta name="description" content="세담엔진 주요 화면 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
  <section style="padding-bottom:0"><div class="wrap">
    <div class="sec-head"><span class="tag">Modules</span><h2>주요 화면</h2><p>분류로 걸러 볼 수 있습니다. 관리자에서 직접 등록·수정·공개 전환이 가능합니다.</p></div>
    <div class="filters" id="filters"><button class="on" data-f="전체">전체</button><button data-f="소득·세액 계산">소득·세액 계산</button><button data-f="전자신고 파일">전자신고 파일</button><button data-f="판정·근거">판정·근거</button><button data-f="파라미터·인터페이스">파라미터·인터페이스</button></div>
  </div></section>
  <section style="padding-top:26px"><div class="wrap"><div class="prod-grid" id="grid"></div></div></section>
  <div class="wrap" style="padding-bottom:44px"><div class="note"><b>정직 고지</b> — 항목명·설명·이미지는 전부 합성입니다. 실제 구축 시 발주처가 제공하는 자료로 채웁니다.</div></div>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("catalog"); DEMO.footer();</script>
<script>
(function(){
  var cur='전체', D=DEMO.D;
  var grid=document.getElementById('grid'), fl=document.getElementById('filters');
  function draw(){
    var v=D.items.filter(function(x){return cur==='전체'||x.cat===cur;});
    grid.innerHTML=v.map(function(x){
      return '<article class="prod"><div class="pimg" style="background-image:url(\''+x.img+'\')"></div>'
      +'<div class="pbody"><span class="chip">'+DEMO.esc(x.cat)+'</span>'
      +'<h3 style="margin-top:10px">'+DEMO.esc(x.name)+'</h3>'
      +'<div class="desc">'+DEMO.esc(x.desc)+'</div>'
      +'<div class="meta"><span>'+DEMO.esc(x.meta)+'</span><b>자세히 →</b></div></div></article>';
    }).join('');
  }
  fl.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    fl.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); cur=b.dataset.f; draw();
  });
  draw();
})();
</script>
</body>
</html>
