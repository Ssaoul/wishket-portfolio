<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 온들파크 (제안용 데모)</title>
<meta name="description" content="온들파크 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>걷고 치는 파크골프를 실내로</h2></div><p>온들파크는 스크린 파크골프 시스템을 직접 만들고 설치하는 가상의 브랜드입니다. 날씨와 계절 때문에 라운드를 쉬어야 했던 동호인과 시설 운영자를 위해 실내 레인을 설계합니다. 공간마다 천장고와 반입 동선이 달라서 실측을 먼저 하고, 그 결과에 맞춰 렌탈과 구매 중 맞는 방식을 안내합니다. 이 화면은 제안용 데모이며 모든 제품·문의 데이터는 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
