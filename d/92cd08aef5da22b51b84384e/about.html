<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 루프레터 마케팅 (제안용 데모)</title>
<meta name="description" content="루프레터 마케팅 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>보여주는 순서를 바꾸면 같은 자료가 다르게 읽힙니다</h2></div><p>문구와 자료는 이미 준비돼 있으니, 이 작업에서 할 일은 고객사가 읽는 순서를 설계하는 것입니다. 주장 다음에 근거, 근거 다음에 원본 캡처가 오도록 순서를 고정하고, 사례마다 차트 규격을 통일해 서로 비교되게 만듭니다. 결과물은 웹빌더 섹션 단위로 나눈 디자인 원본과 이미지 소스라서, 사례가 늘어나도 내부에서 직접 추가할 수 있습니다. 화면의 업종명·수치·사례는 모두 제안용 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
