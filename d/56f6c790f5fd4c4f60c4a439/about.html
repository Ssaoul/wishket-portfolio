<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 온휴 ONHYU (제안용 데모)</title>
<meta name="description" content="온휴 ONHYU 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>뜨거움과 차가움 사이, 쉬는 법을 파는 브랜드</h2></div><p>온휴는 사우나와 휴식을 일상의 습관으로 다루는 가상의 라이프스타일 브랜드입니다. 지금은 타월·가운·사우나 햇 같은 배스 굿즈를 먼저 소개하고, 공간이 정해지면 같은 사이트에서 시설과 방문 예약까지 이어지도록 구조를 잡았습니다. 로고·컬러·폰트는 확정 전이라 이 시안의 색과 서체는 교체를 전제로 한 임시값입니다. 화면의 상품·문구·상태는 모두 제안용 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
