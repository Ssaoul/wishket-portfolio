<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 갤러리 틈과결 (제안용 데모)</title>
<meta name="description" content="갤러리 틈과결 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>두 개의 공간, 하나의 아카이브</h2></div><p>갤러리 틈과결은 종로와 용산 두 곳에서 동시대 작가의 회화·설치·사진을 소개합니다. 전시가 끝나도 작품과 기록은 사라지지 않도록 모든 전시를 아카이브로 남깁니다. 이 사이트는 갤러리 담당자가 직접 전시를 등록하고 작품 이미지를 교체할 수 있도록 설계되었습니다. 화면의 전시·작가·작품 정보는 제안용 데모를 위한 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
