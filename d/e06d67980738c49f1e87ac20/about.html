<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 로안정밀 (제안용 데모)</title>
<meta name="description" content="로안정밀 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>도면을 읽고, 공정으로 답합니다</h2></div><p>로안정밀은 알루미늄·스테인리스 부품의 CNC 가공과 판금, 서브조립을 함께 맡는 가상의 제조 파트너입니다. 이 시안은 회사 소개·제품 소개·연락처·문의하기 4개 화면을 템플릿 위에 구성하고, 이미지와 문구는 관리자 화면에서 직접 바꿀 수 있게 나눴습니다. 화면의 회사명·제품·문의 내역은 모두 제안용 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
