<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 결담 스톤랩 (제안용 데모)</title>
<meta name="description" content="결담 스톤랩 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>벽에 바르는 돌, 수량은 미리 알고 시작합니다</h2></div><p>결담 스톤랩은 얇고 휘어지는 유연석재 패널을 비롯한 내외장재를 소개하는 쇼룸입니다. 시공할 벽의 가로·세로만 입력하면 제품 규격과 로스율을 반영한 필요 박스 수가 바로 나오고, 그 결과를 그대로 견적의뢰로 보낼 수 있습니다. 샘플을 직접 만져 보고 싶다면 원하는 색상을 골라 샘플신청을 남기시면 됩니다. 이 화면의 제품·시공사례·접수 내역은 모두 제안용 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
