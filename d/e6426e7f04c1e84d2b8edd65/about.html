<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 온율회계법인 (제안용 데모)</title>
<meta name="description" content="온율회계법인 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>회계와 세무, 그리고 그 다음의 판단</h2></div><p>온율회계법인은 회계감사와 세무자문을 중심으로 중소·중견기업과 스타트업의 재무 의사결정을 지원합니다. 숫자를 정리하는 데서 멈추지 않고, 그 숫자가 경영에 어떤 선택지를 남기는지 함께 검토합니다. 담당 회계사가 처음부터 끝까지 한 사안을 맡아 설명의 일관성을 지킵니다. 매주 발행하는 인사이트를 통해 세법 개정과 회계 기준 변화를 고객이 먼저 알 수 있도록 정리합니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
