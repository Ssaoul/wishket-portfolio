<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바디노트 — 바디케어 고객관리 시안</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/">
        <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M7 11c2 1.2 8 1.2 10 0M9 21l3-6 3 6"/></svg></span>
        <span class="t">바디노트</span>
      </a>
      <span class="demo-note">제안용 시안 · 모든 데이터는 가상입니다</span>
      <nav class="role-tabs" id="roleTabs" aria-label="역할 전환">
        <button class="role-tab" data-role="admin">관리자로 보기</button>
        <button class="role-tab" data-role="staff">관리사로 보기</button>
        <button class="role-tab" data-role="customer">고객으로 보기</button>
      </nav>
      <button class="btn sm ghost reset-btn" id="resetBtn" title="모든 변경을 지우고 처음 데이터로 되돌립니다">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        데모 초기화
      </button>
    </div>
  </header>
  <div id="app"></div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
