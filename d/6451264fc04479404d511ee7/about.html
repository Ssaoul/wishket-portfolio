<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 결온병원 (제안용 데모)</title>
<meta name="description" content="결온병원 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>지점마다 다른 병원을, 한 사이트로</h2></div><p>결온병원은 지점 4곳이 하나의 이름을 함께 쓰는 가상의 병원입니다. 지점마다 개설된 진료과와 의료진, 진료시간이 달라 환자가 헷갈리지 않도록 게이트웨이에서 먼저 지점을 고르게 했습니다. 예약은 회원가입 없이 본인인증으로 받고, 접수 내역은 각 지점 관리자가 자기 지점 것만 처리합니다. 이 화면은 제안용 데모이며 모든 데이터는 합성 데이터입니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
