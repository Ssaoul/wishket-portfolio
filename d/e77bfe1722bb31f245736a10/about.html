<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 모아보드 (제안용 데모)</title>
<meta name="description" content="모아보드 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>작은 팀의 고객 관리를 한 화면으로</h2></div><p>모아보드는 흩어진 고객 메모와 영업 단계를 한 대시보드에 모으는 가상의 CRM 도구입니다. 이 소개 페이지는 Figma 시안을 PC·태블릿·모바일 세 폭에 옮기고, 문의를 메일로만 받는 구조를 검증하기 위해 만들었습니다. 화면의 회사명·수치·사례는 모두 제안용 합성 데이터이며 실제 고객 성과가 아닙니다. 관리자가 바꿀 수 있는 범위와 개발이 필요한 범위를 섹션마다 구분해 두었습니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
