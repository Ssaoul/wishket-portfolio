<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 누리온정밀 (제안용 데모)</title>
<meta name="description" content="누리온정밀 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>작은 부품 하나도 도면에서 시작합니다</h2></div><p>누리온정밀은 정밀 가공 부품, 판금, 금형, 조립 모듈을 만드는 B2B 제조사입니다. 시제품 몇 개부터 반복 생산까지 같은 공정과 검사 기준으로 대응합니다. 이 페이지의 문구와 사진은 레이아웃 확인용 임시 내용이며, 확정된 회사 소개 문구로 관리자 화면에서 바로 바꿀 수 있습니다. 문의는 도면과 수량만 있으면 시작할 수 있습니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
