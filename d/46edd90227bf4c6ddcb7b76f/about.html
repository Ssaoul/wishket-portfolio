<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 · 에듀보드 스토어 (제안용 데모)</title>
<meta name="description" content="에듀보드 스토어 소개 — 제안용 데모 · 합성 데이터.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<section class="wrap"><div class="sec-head"><h2>교실 하나를 통째로 맡습니다</h2></div><p>전자교탁, 전자칠판, LED스크린부터 교육용 가구와 음향 장비까지 직접 만들고 공급합니다. 장비만 놓고 가는 것이 아니라 인테리어 공사와 설치까지 함께 맡아, 담당자가 여러 업체를 따로 부를 필요가 없습니다. 렌탈·조달·내수 판매를 모두 운영하며, 렌탈은 만기 시 추가 비용 없이 소유로 전환됩니다. 지역총판을 모집하고 있습니다 — 총판 안내 페이지에서 조건을 확인하실 수 있습니다.</p><p class="note">⚠ 이 화면의 모든 값은 <b>합성 데이터</b>입니다. 납품물이 아니라 제안용 시안입니다.</p></section>
</main>
<script src="assets/js/site.js"></script>
<script>DEMO.chrome("about"); DEMO.footer();</script>
<script>
(function(){
  var f=document.getElementById('form'); if(!f) return;
  f.addEventListener('submit', function(e){
    e.preventDefault(); var ok=true;
    [['nm','f-nm'],['ph','f-ph'],['ms','f-ms']].forEach(function(p){
      var bad=!document.getElementById(p[0]).value.trim();
      document.getElementById(p[1]).classList.toggle('bad', bad); if(bad) ok=false;
    });
    if(!ok){ DEMO.toast('필수 항목을 확인해 주세요'); return; }
    DEMO.toast('✓ 문의가 접수되었습니다 (데모 — 실제 전송 안 함)'); f.reset();
  });
  if(location.hash==='#contact'){ setTimeout(function(){ var el=document.getElementById('contact'); if(el) el.scrollIntoView(); },80); }
})();
</script>
</body>
</html>
