<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 아카이브</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--ink:#0B0C0E;--n200:#E8E9EB;--n300:#D3D5D9;--n500:#71757E;--n700:#3F434A;--bad:#C0392B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;color:var(--ink);
background:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(420px,100%)}
h1{font-size:19px;letter-spacing:-.02em;margin-bottom:10px}
p{font-size:14px;line-height:1.65;color:var(--n700)}
.sub{margin-bottom:22px}
form{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;padding:13px 14px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;
border:1px solid var(--n300);border-radius:8px;font-family:inherit;outline:none}
input:focus{border-color:var(--ink)}
button{padding:13px 20px;font-size:14px;font-weight:600;color:#fff;background:var(--ink);
border:0;border-radius:8px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;min-height:20px}
.msg.err{color:var(--bad)}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--n200);font-size:12.5px;color:var(--n500);line-height:1.7}
</style>
</head>
<body>
<main>
<h1>시안 아카이브</h1>
<p class="sub">지원서에 적어드린 <b>열람 코드</b>를 입력해 주세요.</p>
<form id="f" autocomplete="off">
<input id="c" placeholder="ABCD-2345" maxlength="12" aria-label="열람 코드" required>
<button id="b" type="submit">열기</button>
</form>
<p class="msg" id="m"></p>
<p class="foot">
발주마다 따로 만들어 따로 잠급니다. 코드가 있어야 해당 시안만 열립니다.<br>
시안의 화면 값은 전부 합성 데이터이며 납품물이 아닙니다.
</p>
</main>
<script>
(function(){
  var f=document.getElementById('f'), c=document.getElementById('c'),
      b=document.getElementById('b'), m=document.getElementById('m');
  // 코드 → 경로. 서버가 검사하는 게 아니라 **주소가 비밀**이다.
  // node lib/demo-key.mjs 의 pathFor 와 반드시 같은 계산이어야 한다(SHA-256 앞 24자리).
  function pathFor(code){
    var norm = String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(norm)).then(function(buf){
      var a = Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,'0')});
      return a.join('').slice(0,24);
    });
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    m.className='msg'; m.textContent='확인 중…'; b.disabled=true;
    pathFor(c.value).then(function(p){
      var url = './d/' + p + '/';
      // 존재 확인 후 이동 — 없는 경로로 보내 404 를 보여주지 않는다.
      return fetch(url, { method:'GET', cache:'no-store' }).then(function(r){
        if(r.ok){ location.href = url; return; }
        m.className='msg err'; m.textContent='코드가 맞지 않습니다. 지원서의 코드를 다시 확인해 주세요.';
        b.disabled=false;
      });
    }).catch(function(){
      m.className='msg err'; m.textContent='확인에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      b.disabled=false;
    });
  });
})();
</script>
</body>
</html>
